[project]
name = "paicer"
version = "0.1.2"
description = "Training plan tool: YAML to Garmin workouts and readable documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "garminconnect>=0.2.40,<0.3.0",
    "keyring>=24.0",
    "markdown>=3.10.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paicer"]

[project.scripts]
paicer = "paicer.cli:main"
