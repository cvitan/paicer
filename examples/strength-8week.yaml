                  stepType: "repeat"
                  childStepId: 1
                  steps:
                    - stepType: "interval"
                      endCondition: "reps"
                      endConditionValue: 8
                      targetType: "no.target"
                      childStepId: 1
                      category: "SQUAT"
                      exerciseName: "BARBELL_BACK_SQUAT"
                      description: "8 reps @ RPE 7"
