# 8-Week Strength Block — strength-primary example plan.
#
# Demonstrates what the two-week reference plans cannot: progression across
# weeks, a deload, phase structure, and endurance work kept deliberately
# subordinate to lifting. Imperial units.
#
# Exercise names come from the vendored Garmin catalog. Every pair here was
# resolved with `paicer exercises --search` — several plausible guesses were
# wrong (there is no BARBELL_HIP_THRUST; it is BARBELL_HIP_THRUST_ON_FLOOR).
#
# Note there are no warmup steps. Garmin's own strength workouts contain
# none, and adding one creates a phantom set the watch asks you to enter
# reps and weight for at save time. Warmup guidance lives in the workout
# description instead.
#
# See claude-plugin/guides/strength-coaching.md for the programming rationale.

# Easy runs — identical every week. Running is support here, not the goal:
# fixed volume, zone 2 only, placed so it never precedes a lower-body day.
run_sessions:
  - &easy_3mi_garmin
    steps:
      - stepType: "interval"
        endCondition: "distance"
        endConditionValue: 4828  # 3 mi
        targetType: "heart.rate.zone"
        zoneNumber: 2
  - &easy_4mi_garmin
    steps:
      - stepType: "interval"
        endCondition: "distance"
        endConditionValue: 6437  # 4 mi
        targetType: "heart.rate.zone"
        zoneNumber: 2

plan:
  name: "8-Week Strength Block"
  start_date: "2026-09-07"
  training_days: [1, 2, 3, 4, 5, 6]  # Mon, Tue, Wed, Thu, Fri, Sat
  overview: |
    Upper/lower split, four lifting days plus two easy runs. Lifting is the
    priority — running is held at fixed easy volume so it never competes
    with recovery.

    | Day | Session |
    |-----|---------|
    | Mon | Lower A — squat focus |
    | Tue | Upper A — push focus |
    | Wed | Easy run 3 mi |
    | Thu | Lower B — hinge focus |
    | Fri | Upper B — pull focus |
    | Sat | Easy run 4 mi |

    Progression is one variable at a time. Weeks 1-3 add reps at a fixed
    load, week 4 deloads, weeks 5-7 repeat the climb at a heavier load, and
    week 8 tests. Load is prescribed as RPE rather than absolute weight so
    the plan stays correct as you get stronger.

phases:
  - phase: 1
    name: "Accumulation"
    description: |
      Build volume at a fixed load. Reps climb 8 -> 9 -> 10 across three
      weeks, then week 4 deloads. Load does not change inside this phase —
      the progression is reps, and only reps.
    weeks:
      - week: 1
        description: |
          Baseline week. Pick loads you could stop 2-3 reps short of failure on
          every set — you are setting a starting point, not testing.
        workouts:
          - day: 1
            type: "strength"
            name: "Lower A 3x8"
            description: "Warm up first: 8 min bike + hip and ankle mobility. 3 sets of 8 on the main lift @ RPE 7."
