name: Publish plugin to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'plugin-')
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm trusted publishing needs npm >= 11.5.1, newer than the version
      # bundled with Node. Keep node-version current enough for npm@latest —
      # npm 12 requires ^22.22.2 || ^24.15.0 || >=26.0.0.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Verify tag matches package.json and plugin.json versions
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#plugin-}"
          PKG_VERSION=$(node -p "require('./claude-plugin/package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag '$TAG' (version '$VERSION') does not match package.json version '$PKG_VERSION'"
            exit 1
          fi
          PLUGIN_VERSION=$(node -p "require('./claude-plugin/.claude-plugin/plugin.json').version")
          if [ "$VERSION" != "$PLUGIN_VERSION" ]; then
            echo "Tag '$TAG' (version '$VERSION') does not match plugin.json version '$PLUGIN_VERSION'"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish
        working-directory: claude-plugin
